
apiVersion: apps/v1
kind: Deployment

metadata:
  name: iris-api-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: iris-api

  template:
    metadata:
      labels:
        app: iris-api

    spec:
      containers:
        - name: iris-api
          image: iris-mlops-api:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000
